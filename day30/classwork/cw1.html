<!-- 1. შექმენი <h1> თეგი და მიანიჭე წითელი ტექსტის ფერი -->
    <h1 style="color:red;">hello world</h1>
<!-- 2. შექმენი <p> თეგი და მიანიჭე ლურჯი უკანა ფონი. -->
    <p style="background-color: blue;" >hello world</p>
    <!-- 3. შექმენი ღილაკი (button) მწვანე ტექსტით. -->
     <button style="color:green;">click me</button>
     <!-- 4. შექმენი <h2> თეგი ყვითელი ფონით. -->
        <h2 style="background-color: yellow;">hi</h2>
        <!-- 5. შექმენი <p> თეგი და ტექსტი გაასწორე ცენტრში (text-align: center). -->
            <p style="text-align: center;">hello</p>
<!-- 6. შექმენი <h1> თეგი და ტექსტი გაასწორე მარჯვნივ. -->
    <h1 style="text-align: right;">yo</h1>
    <!-- 7. შექმენი ღილაკი შავი ფონით და თეთრი ტექსტით. -->
     <button style="background-color: black; color: white">click</button>
     <!-- 8. შექმენი <div> თეგი იისფერი ფონით. -->
        <div style="background-color: purple;">head</div>
        <!-- 9. შექმენი <p> თეგი ნარინჯისფერი ტექსტით. -->
            <p style="color:orange;">help</p>
            <!-- 10. შექმენი <h3> თეგი და ტექსტი გაასწორე მარცხნივ. -->
<h3 style="text-align: left;">noo</h3>
<!-- 11. შექმენი <button> ლურჯი ფონით და ყვითელი ტექსტით. -->
    <button style="background-color:blue ; color:yellow">me</button>
    <!-- 12. შექმენი <h1> მწვანე ფონით და შავი ტექსტით. -->
 <h1 style="background-color: green; color:black">sos</h1>
 <!-- 13. შექმენი <p> თეთრი ფონით და წითელი ტექსტით. -->
    <p style="background-color: white; color: red">aha</p>
    <!-- 14. შექმენი <div> ცენტრში გასწორებული ტექსტით. -->
        <div style="text-align: center;">nope</div>
        <!-- 15. შექმენი <h2> შავი ფონით და ლურჯი ტექსტით. -->
            <h2 style="background-color: black; color:blue"> ui</h2>
            <!-- 16. შექმენი <button> წითელი ფონით. -->
            <button style="background-color: red;">io</button>
            <!-- 17. შექმენი <p> ყავისფერი ტექსტით. -->
                <p style="color:brown">o</p>
                <!-- 8. შექმენი <h4> ცისფერი ფონით. -->
            <h4 style="background-color: aqua;">oo</h4>
            <!-- 19. შექმენი <div> და ტექსტი გაასწორე მარჯვნივ. -->
            <div style="text-align: right;">ii</div>
            <!-- 20. შექმენი <button> იისფერი ტექსტით. -->
                <button style="color:purple">iii</button>
