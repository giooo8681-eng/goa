 Attributes-ვიყენებთ რამის მისათითებლად. ატრიბუტებია: href, height, width და alt.
 href- უთითებს  hyperlink-ს რა მისამართზე გადაიყვანოს მომხმარებელი რომ დააჭერს
 height-უთითებს ფოტოს სიმაღლეს
 width-უთითებს ფოტოს სიგანეეს
 alt-უთითებს ფოტოს შინაარსს
