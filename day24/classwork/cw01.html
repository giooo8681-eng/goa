autoplay-თავისით რთავს ვიდეოს
controls-ამატებს ვიდეოს სამართო ღილაკებს და ვეელებს ( გადიდება, ხმის აწევა, ხმის ჩაწევა, გადახვეევა და ა.შ)
muted-ხმას უთიშავს ვიდეოს დაწყებისთანავე
loop-როდესაც ვიდეო მთავრდება თავიდან აწყებინებს
